<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Training Cycle</title>
    <meta name="description" content="Strength training cycles with sessions, rest timers and history." />
    <meta name="theme-color" content="#f4f4f8" />
    <!-- Light or dark and the accent colour before the first paint (same logic as src/theme.js) -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var accent = localStorage.getItem('accent')
        var custom = localStorage.getItem('accent-custom')
        var hasCustom = /^#[0-9a-f]{6}$/i.test(custom)
        if (hasCustom) document.documentElement.style.setProperty('--custom', custom.toLowerCase())
        document.documentElement.dataset.accent =
          accent === 'custom' && hasCustom ? 'custom' : /^(blue|teal|pink|graphite)$/.test(accent) ? accent : 'purple'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121217' : '#f4f4f8')
      } catch (e) {}
    </script>
    <!-- Home screen on iPhone: icon, name, full screen without the browser bar -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Training" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
